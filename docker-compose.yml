# Ambiente local de desenvolvimento: só infraestrutura. API e worker rodam no host (make run-*)
# ou entram aqui com seus Dockerfiles, em blocos próprios no fim do arquivo.
name: atp

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/opt/atp/init.sql:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d atividades"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-definitions.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [atp]

  # S3 local (LocalStack, só o serviço s3). O bucket de uploads e a regra de expiração (ADR 0019) são criados
  # pelo script de init quando o LocalStack fica pronto; o healthcheck só passa depois dele. Sem persistência
  # entre recriações (ADR 0035).
  localstack:
    image: localstack/localstack:4.4.0
    profiles: [core]
    environment:
      SERVICES: s3
      DEBUG: "0"
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-uploads}
      UPLOADS_RETENTION_DAYS: ${UPLOADS_RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:${S3_PORT:-4566}:4566"
    volumes:
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/10-uploads-bucket.sh:ro
    healthcheck:
      # /_localstack/init/ready devolve "completed": true e o estado de cada script (fonte do LocalStack v4.4.0).
      # Pronto = estágio concluído, script do bucket executado e nenhum em erro.
      test: ["CMD-SHELL", "out=$$(curl -fsS http://127.0.0.1:4566/_localstack/init/ready) && echo \"$$out\" | grep -Eq '\"completed\": ?true' && echo \"$$out\" | grep -q '\"SUCCESSFUL\"' && ! echo \"$$out\" | grep -q '\"ERROR\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [atp]

  tusd:
    image: tusproject/tusd:v2.6.0
    profiles: [core]
    depends_on:
      localstack:
        condition: service_healthy
    command:
      - -behind-proxy
      - -base-path=/files/
      - -s3-bucket=${UPLOADS_BUCKET:-uploads}
      - -s3-endpoint=http://localstack:4566
      # O token do hook vem da mesma variável da API (TUSD_HOOK_SECRET); use só caracteres seguros em URL.
      - -hooks-http=http://api:9501/hooks/tus?token=${TUSD_HOOK_SECRET:-dev-only-tusd-hook-secret}
      - -hooks-http-forward-headers=Authorization
      - -hooks-enabled-events=pre-create,post-finish
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:${TUSD_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  # Traces OTLP (ADR 0018). UI em http://localhost:8123; OTLP/HTTP só na rede interna (4318).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [core]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-8123}:16686"
    networks: [atp]

  # API de importação. Valida o JWT com a chave pública em services/api/runtime/jwt_public.pem.
  api:
    build: ./services/api
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment: &api-env
      HTTP_PORT: 9501
      DB_HOST: postgres
      DB_DATABASE: importacao
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      S3_ENDPOINT: http://localstack:4566
      S3_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET_KEY}
      # O hook do tusd só é aceito com ?token=<este valor>; vazio recusa todos os hooks. Bucket único aceito no post-finish.
      TUSD_HOOK_SECRET: ${TUSD_HOOK_SECRET:-dev-only-tusd-hook-secret}
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-uploads}
      TUS_PUBLIC_URL: http://localhost:${TUSD_PORT:-8080}/files/
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: api
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-9501}:9501"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9501/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Workers da API sem HTTP: healthcheck por worker:health (banco, broker e atraso da outbox).
  api-relay:
    build: ./services/api
    profiles: [core]
    command: ["outbox:relay"]
    depends_on:
      api:
        condition: service_healthy
    environment: *api-env
    healthcheck:
      test: ["CMD", "php", "bin/hyperf.php", "worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [atp]

  api-consumer:
    build: ./services/api
    profiles: [core]
    command: ["importacao:consume-results"]
    depends_on:
      api:
        condition: service_healthy
    environment: *api-env
    healthcheck:
      test: ["CMD", "php", "bin/hyperf.php", "worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [atp]

  # Worker de ingestão + HTTP de Atividades (amostras internas e correção, ADR 0015).
  # Imagem distroless sem shell: o healthcheck é o próprio binário (-healthcheck).
  # A porta 8122 fica só no loopback do host: /internal/** nunca deve passar por proxy ou gateway público.
  ingest:
    build: ./services/ingest
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      S3_HOST: ${S3_HOST}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      INGEST_COPY_BATCH: ${INGEST_COPY_BATCH:-5000}
      HTTP_ADDR: ":8122"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: ingest
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "127.0.0.1:${INGEST_HTTP_PORT:-8122}:8122"
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Serviço de métricas: consumidores, API de leitura e escrita de limiares (8121).
  metrics:
    build: ./services/metrics
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ingest:
        condition: service_healthy
    environment:
      METRICS_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/metricas?sslmode=disable
      RABBITMQ_URL: ${RABBITMQ_URL}
      ATIVIDADES_BASE_URL: http://ingest:8122
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      HTTP_ADDR: ":8121"
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: metrics
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "127.0.0.1:${METRICS_HTTP_PORT:-8121}:8121"
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Planejamento (Hyperf): API na 8120, relay da outbox e consumidor de métricas em processos próprios.
  planning:
    build: ./services/planning
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment: &planning-env
      HTTP_PORT: 8120
      DB_HOST: postgres
      DB_DATABASE: planejamento
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: planning
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "127.0.0.1:${PLANNING_HTTP_PORT:-8120}:8120"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8120/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]


  # Workers sem HTTP: o healthcheck é o comando worker:health (processo vivo e broker/banco alcançáveis).
  planning-relay:
    build: ./services/planning
    profiles: [core]
    command: ["outbox:relay"]
    depends_on:
      planning:
        condition: service_healthy
    environment: *planning-env
    healthcheck:
      test: ["CMD", "php", "bin/hyperf.php", "worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [atp]

  planning-consumer:
    build: ./services/planning
    profiles: [core]
    command: ["planejamento:consume-metricas"]
    depends_on:
      planning:
        condition: service_healthy
    environment: *planning-env
    healthcheck:
      test: ["CMD", "php", "bin/hyperf.php", "worker:health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks: [atp]

  # Estado do Coach IA: propostas pendentes e orçamento diário de tokens (ADR 0025).
  # Sem porta no host e sem senha: só a rede interna alcança; quem escreve aqui forja proposta pendente.
  redis:
    image: redis:7.4.1-alpine
    profiles: [coach]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  # Coach IA (LangGraph + MCP). Lê métricas e planejamento por HTTP com o JWT do usuário (ADR 0021).
  # Profile próprio `coach`: sem ANTHROPIC_API_KEY o processo recusa subir (não há modelo simulado), então fica fora do `make up`.
  # Uso: docker compose --profile coach --env-file .env up -d redis coach
  coach:
    build: ./services/coach
    profiles: [coach]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      COACH_PORT: 8130
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      METRICS_URL: ${METRICS_URL:-http://metrics:8121}
      PLANNING_URL: ${PLANNING_URL:-http://planning:8120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_LLM_MODEL: ${COACH_LLM_MODEL:-}
      COACH_DAILY_TOKEN_BUDGET: ${COACH_DAILY_TOKEN_BUDGET:-60000}
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "127.0.0.1:${COACH_PORT:-8130}:8130"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8130/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Aplica as migrações de cada contexto (golang-migrate). Uso: make migrate
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        migrate -path /migrations/importacao -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/importacao?sslmode=disable" up &&
        migrate -path /migrations/atividades -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/atividades?sslmode=disable" up &&
        migrate -path /migrations/metricas -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/metricas?sslmode=disable" up &&
        migrate -path /migrations/planejamento -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/planejamento?sslmode=disable" up
    restart: "no"
    networks: [atp]

volumes:
  pgdata:
  rabbitmqdata:

networks:
  atp:
    name: atp-net
