# Ambiente local de desenvolvimento: só infraestrutura. API e worker rodam no host (make run-*)
# ou entram aqui com seus Dockerfiles, em blocos próprios no fim do arquivo.
name: atp

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d atividades"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: [core]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-definitions.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [atp]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    profiles: [core]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    profiles: [core]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${UPLOADS_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      UPLOADS_BUCKET: ${UPLOADS_BUCKET:-uploads}
    restart: "no"
    networks: [atp]

  tusd:
    image: tusproject/tusd:v2.6.0
    profiles: [core]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - -behind-proxy
      - -base-path=/files/
      - -s3-bucket=${UPLOADS_BUCKET:-uploads}
      - -s3-endpoint=http://minio:9000
      - -hooks-http=http://api:9501/hooks/tus
      - -hooks-http-forward-headers=Authorization
      - -hooks-enabled-events=pre-create,post-finish
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "${TUSD_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  # API de importação. Valida o JWT com a chave pública em services/api/runtime/jwt_public.pem.
  api:
    build: ./services/api
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HTTP_PORT: 9501
      DB_HOST: postgres
      DB_DATABASE: importacao
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      S3_ENDPOINT: http://minio:9000
      S3_KEY: ${MINIO_ROOT_USER}
      S3_SECRET: ${MINIO_ROOT_PASSWORD}
      TUS_PUBLIC_URL: http://localhost:${TUSD_PORT:-8080}/files/
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "${HTTP_PORT:-9501}:9501"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9501/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Worker de ingestão: consome ImportacaoRecebida e roda o relay da outbox do banco atividades.
  # Imagem distroless sem shell: não há healthcheck por comando; o worker não expõe HTTP.
  ingest:
    build: ./services/ingest
    profiles: [core]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      INGEST_DATABASE_URL: ${INGEST_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INGEST_MAX_ATTEMPTS: ${INGEST_MAX_ATTEMPTS:-3}
      INGEST_COPY_BATCH: ${INGEST_COPY_BATCH:-5000}
    restart: unless-stopped
    networks: [atp]

  # Estado do Coach IA: propostas pendentes e orçamento diário de tokens (ADR 0025).
  redis:
    image: redis:7.4.1-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [atp]

  # Coach IA (LangGraph + MCP). Lê métricas e planejamento por HTTP com o JWT do usuário (ADR 0021).
  # Sem ANTHROPIC_API_KEY o processo recusa subir: não há modelo simulado em produção.
  coach:
    build: ./services/coach
    profiles: [core]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      COACH_PORT: 8130
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY_FILE: /run/jwt/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-https://idp.example.test/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-athlete-api}
      METRICS_URL: ${METRICS_URL:-http://metricas:8121}
      PLANNING_URL: ${PLANNING_URL:-http://planejamento:8120}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COACH_LLM_MODEL: ${COACH_LLM_MODEL:-}
      COACH_DAILY_TOKEN_BUDGET: ${COACH_DAILY_TOKEN_BUDGET:-60000}
    volumes:
      - ./services/api/runtime:/run/jwt:ro
    ports:
      - "${COACH_PORT:-8130}:8130"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8130/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [atp]

  # Aplica as migrações de cada contexto (golang-migrate). Uso: make migrate
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        migrate -path /migrations/importacao -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/importacao?sslmode=disable" up &&
        migrate -path /migrations/atividades -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/atividades?sslmode=disable" up &&
        migrate -path /migrations/metricas -database "postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/metricas?sslmode=disable" up
    restart: "no"
    networks: [atp]

volumes:
  pgdata:
  rabbitmqdata:
  miniodata:

networks:
  atp:
    name: atp-net
