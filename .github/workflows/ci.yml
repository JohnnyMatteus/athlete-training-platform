# O nome do workflow precisa ser exatamente "CI": o promote.yml escuta esse nome.
name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      planning: ${{ steps.filter.outputs.planning }}
      ingest: ${{ steps.filter.outputs.ingest }}
      metrics: ${{ steps.filter.outputs.metrics }}
      coach: ${{ steps.filter.outputs.coach }}
      contracts: ${{ steps.filter.outputs.contracts }}
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'contracts/**'
            planning:
              - 'services/planning/**'
              - 'contracts/**'
            ingest:
              - 'services/ingest/**'
              - 'contracts/**'
            metrics:
              - 'services/metrics/**'
              - 'contracts/**'
            coach:
              - 'services/coach/**'
              - 'contracts/openapi/**'
            contracts:
              - 'contracts/**'
            app:
              - 'app/**'
              - 'plugins/**'
              - 'contracts/openapi/**'
            plugin:
              - 'plugins/**'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serviço presente?
        id: has
        run: '[ -f services/api/composer.json ] && echo "present=true" >> "$GITHUB_OUTPUT" || true'
      - if: steps.has.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: swoole, pdo_pgsql, bcmath
          tools: composer
      - if: steps.has.outputs.present == 'true'
        working-directory: services/api
        run: |
          composer install --no-interaction --prefer-dist
          composer lint
          composer test
          if composer run-script --list | grep -q 'test:integration'; then composer test:integration; fi

  planning:
    needs: changes
    if: needs.changes.outputs.planning == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: swoole, pdo_pgsql, bcmath, sockets
          tools: composer
      - working-directory: services/planning
        run: |
          composer install --no-interaction --prefer-dist
          composer lint
          composer test

  metrics:
    needs: changes
    if: needs.changes.outputs.metrics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/metrics/go.mod
          cache-dependency-path: services/metrics/go.sum
      - working-directory: services/metrics
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: services/metrics
      - working-directory: services/metrics
        run: |
          go test -race ./...
          go test -tags=integration ./...
          go build ./...

  ingest:
    needs: changes
    if: needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Serviço presente?
        id: has
        run: '[ -f services/ingest/go.mod ] && echo "present=true" >> "$GITHUB_OUTPUT" || true'
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest/go.mod
          cache-dependency-path: services/ingest/go.sum
      - if: steps.has.outputs.present == 'true'
        working-directory: services/ingest
        run: go vet ./...
      - if: steps.has.outputs.present == 'true'
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: services/ingest
      - if: steps.has.outputs.present == 'true'
        working-directory: services/ingest
        run: |
          go test -race ./...
          go test -tags=integration ./...
          go build ./...

  coach:
    needs: changes
    if: needs.changes.outputs.coach == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/coach/package-lock.json
      - working-directory: services/coach
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:evals
          npm run build
          npm audit --omit=dev --audit-level=high

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install check-jsonschema==0.30.0
      - name: Esquemas e exemplos
        run: |
          check-jsonschema --check-metaschema contracts/events/*/*.schema.json
          check-jsonschema --schemafile contracts/events/atividades/atividade-corrigida.v1.schema.json \
            contracts/events/atividades/examples/atividade-corrigida.v1.json
          for n in metricas/metricas-calculadas metricas/limiar-atualizado planejamento/plano-gerado \
                   planejamento/treino-planejado planejamento/plano-ajustado atleta/vinculo-consentido atleta/vinculo-revogado; do
            check-jsonschema --schemafile contracts/events/$n.v1.schema.json \
              contracts/events/$(dirname $n)/examples/$(basename $n).v1.json
          done
          for n in importacao-recebida treino-importado importacao-concluida importacao-falhou; do
            check-jsonschema --schemafile contracts/events/importacao/$n.v1.schema.json \
              contracts/events/importacao/examples/$n.v1.json
          done
      - run: |
          for f in imports planejamento metricas atividades coach-ports; do npx --yes @redocly/cli@1.34.5 lint contracts/openapi/$f.yaml; done
      - run: npx --yes @asyncapi/cli@2.16.2 validate contracts/asyncapi.yaml

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: atp
          POSTGRES_PASSWORD: dev-only-change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atp"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile core --profile tools --profile coach --env-file .env.example config -q
      - name: Migrações (up, esquema, down, up)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
        run: ./infra/scripts/test-migrations.sh

  # Prova a troca do S3 local por LocalStack (ADR 0035) pelo compose real, sem mocks.
  s3-localstack:
    name: S3 local (LocalStack), upload pelo tusd e expiração
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Chaves JWT de desenvolvimento
        run: ./infra/scripts/dev-jwt.sh keys

      # --wait só retorna com todos os healthchecks verdes; o do LocalStack só passa depois que o init-s3.sh
      # terminou sem erro (bucket e regra de expiração criados).
      - name: Subir S3, Postgres e RabbitMQ (--wait)
        run: |
          set -o pipefail
          docker compose --profile core --env-file .env.example up -d --wait --wait-timeout 300 postgres rabbitmq localstack 2>&1 | tee "$RUNNER_TEMP/up-infra.log"

      - name: Migrações
        run: |
          set -o pipefail
          docker compose --profile core --profile tools --env-file .env.example run --rm migrate 2>&1 | tee "$RUNNER_TEMP/migrate.log"

      - name: Subir API, tusd e worker de ingestão (--wait)
        run: |
          set -o pipefail
          docker compose --profile core --env-file .env.example up -d --build --wait --wait-timeout 900 api tusd ingest 2>&1 | tee "$RUNNER_TEMP/up-app.log"

      - name: Upload multipart pelo tusd até o bucket e regra de expiração
        run: |
          set -o pipefail
          ./infra/scripts/e2e-s3-upload.sh 2>&1 | tee "$RUNNER_TEMP/e2e-s3.log"
          grep -q '^OK: ' "$RUNNER_TEMP/e2e-s3.log"

      # Perfil core inteiro, depois da prova do S3 para que uma falha alheia a ele não a esconda.
      - name: Subir o perfil core inteiro (--wait)
        run: |
          set -o pipefail
          docker compose --profile core --env-file .env.example up -d --build --wait --wait-timeout 1200 2>&1 | tee "$RUNNER_TEMP/up-core.log"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile core --env-file .env.example logs --no-color --tail=150 localstack tusd api ingest

      # Só no runner: derruba o ambiente e apaga os volumes.
      - name: Derrubar o ambiente
        if: always()
        run: docker compose --profile core --profile tools --env-file .env.example down -v --remove-orphans

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # inclui o teste que compara os schemas zod com contracts/openapi
      - run: npm test
      - run: npm run build

  # Núcleo Swift do plugin (tradutor, janela deslizante, .fit): Swift Testing, vem com o Xcode 16.
  plugin-swift:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Testes do núcleo
        working-directory: plugins/capacitor-workoutkit/ios/WorkoutKitCore
        run: swift test
      - name: Compila a ponte Capacitor e o mapeador WorkoutKit (iOS)
        working-directory: plugins/capacitor-workoutkit
        run: xcodebuild build -scheme CapacitorWorkoutkit -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  # Job agregador: é o que a proteção de branch e o Promote enxergam.
  ci:
    name: ci-ok
    if: always()
    needs: [changes, api, planning, ingest, metrics, coach, contracts, infra, s3-localstack, app, plugin-swift]
    runs-on: ubuntu-latest
    steps:
      - name: Falha se algum job falhou ou foi cancelado
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then exit 1; fi

